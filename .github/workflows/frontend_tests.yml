name: Frontend tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: npx vitest run --root apps/frontend
